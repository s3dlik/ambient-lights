<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ambient Lights</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Ambient Lights</h1>
    <span class="pill" id="conn-pill"><span class="dot" id="conn-dot"></span><span id="conn-label">Not connected</span></span>
  </header>

  <main>
    <section id="view-connect"></section>
    <section id="view-rgb" hidden></section>
    <section id="view-flow" hidden></section>
    <section id="view-light" hidden></section>
    <section id="view-car" hidden></section>
    <section id="view-device" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="rgb" aria-label="RGB lights">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><circle cx="15" cy="9" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg>RGB
    </button>
    <button data-tab="flow" aria-label="Light bar effects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 15c3-6 6 6 9 0s6 6 9 0"/><path d="M3 9c3-6 6 6 9 0s6 6 9 0" opacity=".5"/></svg>Light bars
    </button>
    <button data-tab="light" aria-label="Brightness and power">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light
    </button>
    <button data-tab="car" aria-label="Car integration">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/></svg>Car
    </button>
    <button data-tab="device" aria-label="Device">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>Device
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
